<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oldie — Vintage Commercials</title>
<style>
  :root{
    --bg:#0d0a07; --amber:#e8a33d; --amber2:#f5c86e;
    --text:#f4ecdc; --muted:#ab9a82;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    /* the room: dark wood floor below; light layers live in ::before/::after
       so they can fade independently when the set is playing */
    background:
      radial-gradient(135% 105% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%),
      linear-gradient(180deg, #0a0705 0%, #0c0906 62%, #131009 62.5%, #0e0a06 66%, #080604 100%);
  }
  /* warm tungsten spill from above — dims when you're watching */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(1100px 480px at 50% -120px, rgba(255,186,110,.13), rgba(255,186,110,0) 62%);
    transition:opacity 1.6s ease;
  }
  body.watching::before{opacity:.22;}
  /* extra darkness closing in at the edges — fades up when you're watching */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:
      radial-gradient(135% 105% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.66) 100%);
    opacity:0; transition:opacity 1.6s ease;
  }
  body.watching::after{opacity:1;}
  main, footer{position:relative; z-index:2;}
  .player-wrap{width:100%;}

  /* ============ 70s wooden console TV ============ */
  .tv-scene{perspective:1500px; padding:30px 14px 6px; width:100%;}
  .tv-scene::after{content:""; display:block; height:70px; margin:-6px 60px 0;
    background:radial-gradient(52% 100% at 50% 0, rgba(255,178,102,.14), rgba(255,178,102,0) 70%);}
  main{width:100%; max-width:1120px; margin:0 auto; padding:10px 14px 30px; flex:1; display:flex; align-items:center;}
  .tv-cabinet{position:relative; transform:rotateX(6deg); transform-origin:50% 100%;
    border-radius:14px; padding:0;
    background:
      linear-gradient(180deg, rgba(255,214,160,.09), rgba(255,214,160,0) 26%),
      repeating-linear-gradient(92deg, rgba(12,6,2,.17) 0 2px, rgba(255,200,140,.05) 2px 4px, transparent 4px 13px),
      repeating-linear-gradient(89deg, transparent 0 90px, rgba(0,0,0,.13) 90px 93px, transparent 93px 190px),
      linear-gradient(180deg,#4e3018 0%,#3a2210 45%,#221306 100%);
    box-shadow:0 44px 90px rgba(0,0,0,.65), 0 10px 26px rgba(0,0,0,.5),
      inset 0 2px 0 rgba(255,220,170,.22), inset 0 -4px 10px rgba(0,0,0,.5),
      inset 2px 0 0 rgba(255,220,170,.08), inset -2px 0 0 rgba(0,0,0,.4);
  }
  .tv-lid{position:absolute; left:10px; right:10px; top:1px; height:46px; z-index:0;
    transform:rotateX(64deg); transform-origin:50% 0;
    background:linear-gradient(180deg,#5c3b21 0%,#3d2410 100%);
    border-radius:10px 10px 0 0;
    box-shadow:inset 0 2px 0 rgba(255,226,180,.24);
  }
  .tv-front{position:relative; z-index:1; padding:30px 28px 20px;}
  .tv-mains{display:flex; gap:24px; align-items:stretch;}
  .tv-screen{flex:1 1 auto; min-width:0;}
  .tv-tube{position:relative; border-radius:18px; padding:7px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px),
      linear-gradient(165deg,#333338 0%,#1d1d22 45%,#0f0f13 100%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.18), inset 0 -2px 6px rgba(0,0,0,.8),
      0 2px 8px rgba(0,0,0,.6);
  }
  .tv-view{position:relative; border-radius:12px; overflow:hidden; background:#000;
    box-shadow:inset 0 0 60px rgba(0,0,0,.85); cursor:pointer; aspect-ratio:16/9;
  }
  .tv-picture{position:absolute; inset:0; transform-origin:50% 50%;}
  .tv-picture video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:block;}
  #staticCanvas{position:absolute; inset:0; width:100%; height:100%; display:none; transition:opacity .35s ease;}
  /* CRT scanlines — faint, always there, over picture and static alike */
  .tv-scanlines{position:absolute; inset:0; z-index:3; pointer-events:none; border-radius:12px;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);}
  /* faint projector flicker while a reel plays — abrupt, film-like */
  video.film{animation:filmFlicker 5s steps(1,end) infinite;}
  @keyframes filmFlicker{
    0%,100%{filter:brightness(1);}
    6%{filter:brightness(1.035);}
    7%{filter:brightness(.965);}
    8%{filter:brightness(1);}
    34%{filter:brightness(1.02);}
    35%{filter:brightness(.98);}
    36%{filter:brightness(1);}
    68%{filter:brightness(.975);}
    69%{filter:brightness(1.025);}
    70%{filter:brightness(1);}
  }
  .tv-glass{position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:12px;
    background:
      radial-gradient(115% 85% at 20% 6%, rgba(255,255,255,.13), rgba(255,255,255,0) 44%),
      radial-gradient(145% 125% at 50% 52%, transparent 60%, rgba(0,0,0,.46) 100%);
  }
  .tv-glass::after{content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 1px, transparent 1px 4px);}
  .tv-hint{position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; pointer-events:none;
    color:var(--amber2); font-family:Georgia,serif; font-style:italic; font-size:17px; line-height:1.7;
    text-shadow:0 2px 12px rgba(0,0,0,.9);}
  .tv-hint[hidden]{display:none;}
  /* the tuning roll: losing vertical hold for a beat on channel change */
  .tv-picture.tuning{animation:tuneRoll .55s cubic-bezier(.3,.7,.4,1);}
  @keyframes tuneRoll{
    0%{transform:translateY(0) skewX(0);}
    35%{transform:translateY(-13%) skewX(1.4deg);}
    70%{transform:translateY(5%) skewX(-.7deg);}
    100%{transform:translateY(0) skewX(0);}
  }
  .tv-picture.crt-off{animation:picOff .48s ease-in forwards;}
  .tv-picture.crt-on{animation:picOn .42s ease-out;}
  @keyframes picOff{
    0%{transform:scale(1,1); filter:brightness(1); opacity:1;}
    45%{transform:scale(1,.004); filter:brightness(2.8); opacity:1;}
    72%{transform:scale(.04,.004); filter:brightness(3.6); opacity:1;}
    100%{transform:scale(0,0); filter:brightness(4); opacity:0;}
  }
  @keyframes picOn{
    0%{transform:scale(0,0); filter:brightness(4); opacity:0;}
    40%{transform:scale(.04,.004); filter:brightness(3.2); opacity:1;}
    70%{transform:scale(1,.004); filter:brightness(2.4); opacity:1;}
    100%{transform:scale(1,1); filter:brightness(1); opacity:1;}
  }
  /* side column: control panel + speaker grille */
  .tv-side{flex:0 0 196px; display:flex; flex-direction:column; gap:16px;}
  .tv-panel{background:linear-gradient(180deg,#1d1d21,#0f0f12); border-radius:12px; padding:16px 12px 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.13), inset 0 -3px 8px rgba(0,0,0,.75), 0 3px 8px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; gap:14px;}
  .ch-win{background:#0b0704; border-radius:7px; padding:7px 18px 5px; min-width:64px; text-align:center;
    box-shadow:inset 0 3px 10px #000, inset 0 -1px 0 rgba(255,180,90,.15);
    font-family:"Courier New",monospace; font-weight:700; font-size:22px; letter-spacing:3px; color:#ffb347;
    text-shadow:0 0 8px rgba(255,179,71,.85);}
  .knob-row{display:flex; gap:18px;}
  .knob-unit{display:flex; flex-direction:column; align-items:center; gap:7px;}
  .knob-unit label{font-size:9.5px; letter-spacing:2.5px; text-transform:uppercase; color:#9a8a76; font-weight:700;}
  .knob{width:62px; height:62px; border-radius:50%; border:none; cursor:pointer; position:relative; padding:0;
    background:radial-gradient(circle at 34% 28%, #77777f, #3d3d45 52%, #1a1a1f 100%);
    box-shadow:0 5px 12px rgba(0,0,0,.65), inset 0 2px 3px rgba(255,255,255,.28), inset 0 -4px 8px rgba(0,0,0,.65);
    transition:transform .1s;}
  .knob:active{transform:scale(.94);}
  .knob::before{content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:repeating-conic-gradient(from 0deg, rgba(0,0,0,.30) 0deg 4deg, rgba(255,255,255,.06) 4deg 8deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, transparent 68%, #000 69%);
    mask:radial-gradient(circle at 50% 50%, transparent 68%, #000 69%);}
  .knob .ptr{position:absolute; inset:0; display:block; transition:transform .22s cubic-bezier(.3,1.4,.5,1);}
  .knob .ptr::before{content:""; position:absolute; left:50%; top:7px; width:5px; height:17px; margin-left:-2.5px;
    border-radius:3px; background:linear-gradient(180deg,#ffd9a0,#e8a33d);
    box-shadow:0 0 6px rgba(232,163,61,.9);}
  .knob .ptr::after{content:""; position:absolute; inset:9px; border-radius:50%;
    background:radial-gradient(circle at 40% 32%, #55555e, #26262c 70%);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6);}
  .power{display:flex; align-items:center; gap:9px; cursor:pointer;
    background:linear-gradient(180deg,#3a3a41,#232327); color:#cfc4b2;
    border:1px solid rgba(255,255,255,.10); border-radius:9px; padding:9px 18px;
    font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; font-weight:800;
    box-shadow:0 3px 8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);}
  .power:active{transform:translateY(1px);}
  .power .led{width:9px; height:9px; border-radius:50%; background:#7dff9a;
    box-shadow:0 0 8px rgba(125,255,154,.95), inset 0 -1px 2px rgba(0,0,0,.4);}
  .power.off .led{background:#5a2b22; box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  .tv-grille{flex:1; min-height:130px; border-radius:10px;
    background:
      repeating-linear-gradient(90deg, #150c04 0 9px, #472c17 9px 17px, #5a3a20 17px 19px, #150c04 19px 22px),
      linear-gradient(180deg,#38220f,#221306);
    box-shadow:inset 0 4px 12px rgba(0,0,0,.8), inset 0 -2px 5px rgba(255,220,170,.08), 0 2px 5px rgba(0,0,0,.45);}
  .tv-carve{margin-top:20px; height:46px; border-radius:9px; position:relative;
    background:linear-gradient(180deg,#472c16,#281507);
    box-shadow:inset 0 3px 7px rgba(0,0,0,.65), inset 0 -2px 0 rgba(255,220,170,.12), 0 2px 4px rgba(0,0,0,.4);}
  .tv-carve::before{content:""; position:absolute; inset:11px 26px; border-radius:6px;
    border:2px solid rgba(0,0,0,.32);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,220,170,.16);}
  .tv-carve::after{content:"OLDIE"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; letter-spacing:9px; font-weight:800; padding-left:9px;
    color:rgba(0,0,0,.48); text-shadow:0 1px 0 rgba(255,220,170,.16);}
  .tv-plinth{height:24px; margin:0 30px; border-radius:0 0 12px 12px;
    background:linear-gradient(180deg,#221306,#120a03);
    box-shadow:0 18px 34px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,220,170,.10);}
  @media (max-width:640px){
    .tv-mains{flex-direction:column;}
    .tv-side{flex:none;}
    .tv-panel{flex-direction:row; justify-content:space-around; align-items:center; padding:12px 10px;}
    .knob-row{gap:14px;}
    .tv-grille{min-height:74px;}
    .knob{width:54px; height:54px;}
    .tv-front{padding:22px 16px 16px;}
  }
  @media (prefers-reduced-motion:reduce){
    .tv-picture.crt-off,.tv-picture.crt-on{animation-duration:.01s;}
    .tv-picture.tuning{animation:none;}
    video.film{animation:none;}
    .knob .ptr{transition:none;}
  }
  footer{padding:0 16px 34px; color:var(--muted); font-size:12px; text-align:center; line-height:1.9;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<main>
  <div class="player-wrap">
    <div class="tv-scene">
      <div class="tv-cabinet" id="tvCabinet">
        <div class="tv-lid" aria-hidden="true"></div>
        <div class="tv-front">
          <div class="tv-mains">
            <div class="tv-screen">
              <div class="tv-tube" id="tvTube">
                <div class="tv-view" id="tvView" title="Change the channel">
                  <div class="tv-picture" id="tvPicture">
                    <video id="player" playsinline preload="auto"></video>
                    <canvas id="staticCanvas" width="160" height="90" aria-hidden="true"></canvas>
                    <div class="tv-scanlines" aria-hidden="true"></div>
                  </div>
                  <div class="tv-glass" aria-hidden="true"></div>
                  <div class="tv-hint" id="tvHint">Turn the channel knob…<br>you never know what you'll get.</div>
                </div>
              </div>
            </div>
            <div class="tv-side">
              <div class="tv-panel">
                <div class="ch-win"><span id="chNum">2</span></div>
                <div class="knob-row">
                  <div class="knob-unit">
                    <button class="knob" id="knobCh" aria-label="Change channel"><span class="ptr" id="chPtr"></span></button>
                    <label>Channel</label>
                  </div>
                  <div class="knob-unit">
                    <button class="knob" id="knobVol" aria-label="Volume (drag or tap to mute)"><span class="ptr" id="volPtr"></span></button>
                    <label>Volume</label>
                  </div>
                </div>
                <button class="power on" id="btnPower" aria-label="Power"><span class="led"></span>Power</button>
              </div>
              <div class="tv-grille" aria-hidden="true"></div>
            </div>
          </div>
          <div class="tv-carve" aria-hidden="true"></div>
        </div>
        <div class="tv-plinth" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  Commercials stream free from the Internet Archive's Prelinger Archive — public-domain films, free to reuse.<br>
  Turn the knob. See what the past was selling.
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
